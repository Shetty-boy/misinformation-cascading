[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascade2vec"
version = "0.1.0"
description = "Adaptive early misinformation detection via time-weighted cascade embeddings"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade2vec"]
